  <!-- =========================================================
       기기별 자동 분기
       - 일반 휴대폰 사용자는 각 스토어로 자동 이동
       - 검색로봇은 페이지 내용을 수집할 수 있도록 이동 제외
       ========================================================= -->
  <script>
    const androidUrl =
      "https://play.google.com/store/apps/details?id=com.moding.application";

    const iosUrl =
      "https://apps.apple.com/kr/app/%EB%AA%A8%EB%94%A9-%EC%9A%B0%EB%A6%AC%EC%8B%9D%EB%8B%B9%EC%97%90-%ED%95%84%EC%9A%94%ED%95%9C-%ED%8A%B9%EC%88%98%EC%8B%9D%EC%9E%90%EC%9E%AC/id6772018982";

    const ua =
      navigator.userAgent ||
      navigator.vendor ||
      window.opera ||
      "";

    /*
     * 실제 검색로봇만 자동 이동에서 제외합니다.
     * 네이버 앱 및 네이버 인앱 브라우저 사용자는 정상적으로 분기됩니다.
     */
    const isBot =
      /bot|crawl|crawler|spider|slurp|yeti|googlebot|bingbot|daumoa|ads-naver|blueno/i.test(ua);

    const isAndroid = /android/i.test(ua);

    const isIOS =
      /iPhone|iPad|iPod/i.test(ua) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

    /* 검색로봇은 자동 이동시키지 않음 */
    if (!isBot) {
      if (isAndroid) {
        window.location.replace(androidUrl);
      } else if (isIOS) {
        window.location.replace(iosUrl);
      }
    }
  </script>
