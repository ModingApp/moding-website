       따라서 정상적인 모바일 접속에서는

  <!-- =========================================================
       04. 자동분기 + 채널 추적
       ========================================================= -->
  <script>
    /* =========================================================
       API / STORE URL
       ========================================================= */

    const TRACK_API =
      "https://flat-queen-f1fb.moding-inc.workers.dev/track/download";


    const ANDROID_URL =
      "https://play.google.com/store/apps/details?id=com.moding.application";


    const IOS_URL =
      "https://apps.apple.com/kr/app/%EB%AA%A8%EB%94%A9-%EC%9A%B0%EB%A6%AC%EC%8B%9D%EB%8B%B9%EC%97%90-%ED%95%84%EC%9A%94%ED%95%9C-%ED%8A%B9%EC%88%98%EC%8B%9D%EC%9E%90%EC%9E%AC/id6772018982";


    /* =========================================================
       USER AGENT
       ========================================================= */

    const USER_AGENT =
      navigator.userAgent ||
      navigator.vendor ||
      window.opera ||
      "";


    /* =========================================================
       검색로봇 판별

       검색로봇은 스토어로 보내지 않고
       download.html 내용을 수집하도록 합니다.
       ========================================================= */

    const IS_BOT =
      /bot|crawl|crawler|spider|slurp|yeti|googlebot|bingbot|daumoa|ads-naver|blueno/i
        .test(USER_AGENT);


    /* =========================================================
       Android 판별
       ========================================================= */

    const IS_ANDROID =
      /android/i.test(USER_AGENT);


    /* =========================================================
       iPhone / iPad 판별

       최신 iPadOS는 User Agent를
       Mac처럼 표현할 수 있으므로
       터치 포인트까지 함께 확인합니다.
       ========================================================= */

    const IS_IOS =
      /iPhone|iPad|iPod/i.test(USER_AGENT) ||
      (
        navigator.platform === "MacIntel" &&
        navigator.maxTouchPoints > 1
      );


    /* =========================================================
       모바일 자동분기 대상
       ========================================================= */

    const IS_MOBILE_STORE_TARGET =
      !IS_BOT &&
      (
        IS_ANDROID ||
        IS_IOS
      );


    /* =========================================================
       SOURCE 정리

       예:

       ?src=daangn
       ?src=naver_cafe
       ?src=naver_blog
       ?src=kakao
       ?src=youtube
       ?src=leaflet
       ========================================================= */

    function normalizeSource(value) {
      const source =
        String(value || "")
          .trim()
          .toLowerCase()
          .replace(
            /[^a-z0-9_-]/g,
            ""
          )
          .slice(
            0,
            50
          );


      return source;
    }


    /* =========================================================
       Referrer 기반 보조 판별

       src 파라미터가 있는 경우에는
       src가 항상 우선합니다.
       ========================================================= */

    function detectReferrerSource() {
      const referrer =
        document.referrer || "";


      if (!referrer) {
        return "";
      }


      try {
        const hostname =
          new URL(referrer)
            .hostname
            .toLowerCase();


        if (
          hostname.includes("daangn") ||
          hostname.includes("karrot")
        ) {
          return "daangn";
        }


        if (
          hostname.includes("naver")
        ) {
          return "naver";
        }


        if (
          hostname.includes("kakao") ||
          hostname.includes("daum")
        ) {
          return "kakao";
        }


        if (
          hostname.includes("youtube") ||
          hostname.includes("youtu.be")
        ) {
          return "youtube";
        }


        if (
          hostname.includes("instagram")
        ) {
          return "instagram";
        }


        if (
          hostname.includes("facebook")
        ) {
          return "facebook";
        }


        if (
          hostname.includes("google")
        ) {
          return "google";
        }


        return "referral";

      } catch (_) {
        return "";
      }
    }


    /* =========================================================
       최종 유입 Source

       우선순위

       1. src
       2. utm_source
       3. 현재 세션에 저장된 source
       4. document.referrer
       5. direct
       ========================================================= */

    function getTrafficSource() {
      const params =
        new URLSearchParams(
          window.location.search
        );


      const explicitSource =
        normalizeSource(
          params.get("src") ||
          params.get("utm_source")
        );


      if (explicitSource) {
        try {
          sessionStorage.setItem(
            "moding_source",
            explicitSource
          );
        } catch (_) {}


        return explicitSource;
      }


      try {
        const savedSource =
          normalizeSource(
            sessionStorage.getItem(
              "moding_source"
            )
          );


        if (savedSource) {
          return savedSource;
        }

      } catch (_) {}


      const referrerSource =
        detectReferrerSource();


      if (referrerSource) {
        try {
          sessionStorage.setItem(
            "moding_source",
            referrerSource
          );
        } catch (_) {}


        return referrerSource;
      }


      return "direct";
    }


    const TRAFFIC_SOURCE =
      getTrafficSource();


    /* =========================================================
       같은 페이지에서 중복 카운팅 방지
       ========================================================= */

    let downloadTracked =
      false;


    /* =========================================================
       카운팅

       1순위:
       navigator.sendBeacon

       - 전송 완료를 기다릴 필요 없음
       - 즉시 외부 스토어 이동 가능
       - 페이지 이동 중 분석 이벤트 전송에 적합

       2순위:
       fetch + keepalive
       ========================================================= */

    function trackDownload(platform) {
      if (downloadTracked) {
        return;
      }


      downloadTracked =
        true;


      const trackingUrl =
        TRACK_API +
        "?platform=" +
        encodeURIComponent(platform) +
        "&src=" +
        encodeURIComponent(TRAFFIC_SOURCE);


      /* ---------------------------------------------------------
         sendBeacon
         --------------------------------------------------------- */

      try {
        if (
          typeof navigator.sendBeacon ===
          "function"
        ) {
          const sent =
            navigator.sendBeacon(
              trackingUrl,
              ""
            );


          if (sent) {
            return;
          }
        }

      } catch (_) {}


      /* ---------------------------------------------------------
         Fallback
         --------------------------------------------------------- */

      try {
        fetch(
          trackingUrl,
          {
            method:
              "POST",

            keepalive:
              true,

            cache:
              "no-store"
          }
        )
          .catch(
            () => {}
          );

      } catch (_) {}
    }


    /* =========================================================
       모바일 즉시 스토어 이동
       ========================================================= */

    function redirectToStore(
      platform,
      storeUrl
    ) {
      /*
       * 카운팅 요청만 발생시킵니다.
       * 완료를 기다리지 않습니다.
       */
      trackDownload(
        platform
      );


      /*
       * 다운로드 HTML 화면을 표시하지 않고
       * 즉시 스토어로 교체합니다.
       */
      window.location.replace(
        storeUrl
      );
    }


    /* =========================================================
       실제 자동분기

       Android
       → Google Play

       iPhone / iPad
       → App Store

       PC / 일반 Mac
       → download.html 표시

       검색로봇
       → download.html 표시
       ========================================================= */

    if (
      !IS_BOT &&
      IS_ANDROID
    ) {
      redirectToStore(
        "android",
        ANDROID_URL
      );


    } else if (
      !IS_BOT &&
      IS_IOS
    ) {
      redirectToStore(
        "ios",
        IOS_URL
      );


    } else {
      /*
       * PC / Mac / 검색로봇
       */
      document.documentElement.style.visibility =
        "visible";
    }


    /* =========================================================
       모바일 자동분기 실패 대비

       정상적인 경우 이미 App Store / Google Play로
       이동했기 때문에 이 코드는 실행될 화면이 없습니다.

       특수 인앱브라우저 등에서 외부 이동이 실패해서
       download.html에 계속 남아 있을 때만
       2.5초 뒤 수동 선택 화면을 보여줍니다.
       ========================================================= */

    if (IS_MOBILE_STORE_TARGET) {
      window.setTimeout(
        () => {
          document.documentElement.style.visibility =
            "visible";
        },
        2500
      );
    }
  </script>
