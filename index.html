  <style>
    /* =========================================================
       1. 브랜드 컬러 / 공통 변수
       ========================================================= */
    :root {
      --moding-green: #238B22;
      --moding-green-dark: #1c6f1c;
      --moding-orange: #FF8C00;
      --moding-orange-dark: #e67800;

      --bg-white: #ffffff;

      --border-light: #e1e4e2;
      --shadow-soft: 0 16px 42px rgba(0, 0, 0, 0.08);
      --shadow-card: 0 14px 34px rgba(0, 0, 0, 0.10);
      --shadow-card-hover: 0 22px 48px rgba(0, 0, 0, 0.14);
    }

    /* =========================================================
       2. Reset / 기본 설정
       ========================================================= */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
      background: var(--bg-light);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    a {
      color: inherit;
    }

    img {
      max-width: 100%;
      height: auto;
      display: block;
    }

    .page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .container {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 0 24px;
    }

    /* =========================================================
       3. Header / Navigation
       ========================================================= */
    header {
      width: 100%;
      background: var(--bg-white);
      border-bottom: 1px solid var(--border-light);
    }

    .nav {
      width: 100%;
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 28px;
    }

    .nav-logo {
      display: inline-flex;
      align-items: center;
      text-decoration: none;
      flex-shrink: 0;
    }

    .nav-logo img {
      width: 136px;
      height: auto;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 22px;
      font-size: 15px;
      font-weight: 700;
    }

    .nav-menu a {
      text-decoration: none;
      color: var(--moding-green);
      white-space: nowrap;
      transition: color 0.2s ease;
    }

    .nav-menu a:hover {
      color: var(--moding-orange);
    }

    /* =========================================================
       4. Main / Hero
       ========================================================= */
    main {
      flex: 1;
      width: 100%;
    }

    .hero {
      width: 100%;
      text-align: center;
      padding: 70px 0 68px;
    }

    .hero-title {
      font-size: clamp(30px, 4.2vw, 48px);
      font-weight: 850;
      line-height: 1.28;
      letter-spacing: -0.045em;
      color: var(--moding-green);
      margin-bottom: 0;

      opacity: 0;
      transform: translateY(18px);
      animation: heroTextUp 0.72s ease forwards;
    }

    .hero-title .orange {
      color: var(--moding-orange);
    }

    /* =========================================================
       5. 공통 다운로드 버튼
       - 모바일은 스토어로 직접 연결
       - PC·판별 불가 환경은 download.html로 이동
       - 기존 초록 · 주황 브랜드 컬러 유지
       ========================================================= */
    .download-wrapper {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      align-items: center;

      opacity: 0;
      transform: translateY(14px);
      animation: heroTextUp 0.72s ease 0.18s forwards;
    }

    .download-btn {
      position: relative;
      width: 300px;
      min-height: 66px;
      padding: 13px 24px;
      border-radius: 20px;

      background:
        linear-gradient(#ffffff, #ffffff) padding-box,
        linear-gradient(135deg, var(--moding-green), var(--moding-orange)) border-box;

      border: 2px solid transparent;
      color: var(--moding-green);
      text-decoration: none;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 13px;

      box-shadow:
        0 12px 28px rgba(35, 139, 34, 0.13),
        0 4px 12px rgba(255, 140, 0, 0.06);

      animation: downloadPulse 2.8s ease-in-out infinite;

      transition:
        background 0.2s ease,
        color 0.2s ease,
        transform 0.2s ease,
        box-shadow 0.2s ease;
    }

    .download-btn:hover {
      transform: translateY(-3px);

      background:
        linear-gradient(135deg, var(--moding-green), var(--moding-orange)) padding-box,
        linear-gradient(135deg, var(--moding-green), var(--moding-orange)) border-box;

      color: #ffffff;

      box-shadow:
        0 18px 38px rgba(35, 139, 34, 0.17),
        0 8px 22px rgba(255, 140, 0, 0.15);
    }

    .download-icon {
      width: 36px;
      height: 36px;
      border-radius: 999px;
      background: rgba(255, 140, 0, 0.12);
      color: var(--moding-orange);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 19px;
      font-weight: 950;
      line-height: 1;
      transition:
        background 0.2s ease,
        color 0.2s ease;
    }

    .download-text {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
    }

    .download-btn-main {
      display: block;
      font-size: 17px;
      font-weight: 950;
      line-height: 1.25;
      letter-spacing: -0.035em;
    }

    .download-btn-sub {
      display: block;
      margin-top: 3px;
      font-size: 11.5px;
      font-weight: 800;
      line-height: 1.25;
      color: var(--moding-orange);
      letter-spacing: -0.01em;
      transition: color 0.2s ease;
    }

    .download-btn:hover .download-icon {
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
    }

    .download-btn:hover .download-btn-sub {
      color: rgba(255, 255, 255, 0.9);
    }

    .download-note {
      margin-top: 12px;
      margin-bottom: 0;
      font-size: 13px;
      color: #777777;
      line-height: 1.6;

      opacity: 0;
      transform: translateY(12px);
      animation: heroTextUp 0.72s ease 0.30s forwards;
    }

    /* =========================================================
       6. 메인 비주얼 이미지 3장 영역
       ========================================================= */
    .hero-visual-section {
      width: 100%;
      margin: 36px auto 34px;
    }

    .hero-visual-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      align-items: start;
    }

    .hero-visual-card {
      width: 100%;
      border-radius: 28px;
      background: #ffffff;
      box-shadow: var(--shadow-card);
      overflow: hidden;

      opacity: 0;
      transform: translateY(34px) scale(0.97);
      animation: posterFadeUp 0.85s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    .hero-visual-card:nth-child(1) {
      animation-delay: 0.42s;
    }

    .hero-visual-card:nth-child(2) {
      animation-delay: 0.56s;
    }

    .hero-visual-card:nth-child(3) {
      animation-delay: 0.70s;
    }

    .hero-visual-card img {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (hover: hover) and (pointer: fine) {
      .hero-visual-card {
        transition:
          transform 0.24s ease,
          box-shadow 0.24s ease;
      }

      .hero-visual-card:hover {
        transform: translateY(-6px) scale(1.012);
        box-shadow: var(--shadow-card-hover);
      }
    }

    /* =========================================================
       7. Footer
       ========================================================= */
    footer {
      width: 100%;
      margin-top: auto;
      padding: 24px 10px;
      background: var(--bg-white);
      border-top: 1px solid var(--border-light);
      text-align: center;
      font-size: 12px;
      line-height: 1.8;
      color: #777777;
    }

    .footer-links {
      margin-bottom: 5px;
      font-size: 12px;
      text-align: center;
    }

    .footer-links a {
      text-decoration: none;
      color: var(--moding-green);
      font-weight: 700;
    }

    .footer-links a:hover {
      color: var(--moding-orange);
    }

    .footer-links .divider {
      margin: 0 6px;
      color: #bbbbbb;
    }

    /* =========================================================
       8. 복사 / 드래그 방지
       ========================================================= */
    html,
    body,
    *:not(input):not(textarea) {
      -webkit-user-select: none;
      user-select: none;
    }

    img {
      -webkit-user-drag: none;
      user-drag: none;
      pointer-events: none;
    }

    input,
    textarea {
      user-select: text;
      pointer-events: auto;
    }

    /* =========================================================
       9. Animation
       ========================================================= */
    @keyframes heroTextUp {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes posterFadeUp {
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes downloadPulse {
      0% {
        box-shadow:
          0 12px 28px rgba(35, 139, 34, 0.10),
          0 4px 12px rgba(255, 140, 0, 0.04);
      }

      50% {
        box-shadow:
          0 16px 34px rgba(35, 139, 34, 0.18),
          0 7px 18px rgba(255, 140, 0, 0.10);
      }

      100% {
        box-shadow:
          0 12px 28px rgba(35, 139, 34, 0.10),
          0 4px 12px rgba(255, 140, 0, 0.04);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      .hero-title,
      .download-wrapper,
      .download-note,
      .hero-visual-card {
        opacity: 1;
        transform: none;
        animation: none;
      }

      .download-btn {
        animation: none;
      }

      .download-btn,
      .nav-menu a {
        transition: none;
      }
    }

    /* =========================================================
       10. Responsive / 노트북 · 태블릿
       ========================================================= */
    @media (max-width: 1024px) {

      }

      }

      .hero-visual-card {

    /* =========================================================
       11. Responsive / 태블릿 세로

      }

        flex-wrap: wrap;
        justify-content: center;
        font-size: 14px;
      }

      .container {
        padding: 0 20px;
      }

      .hero {

      }

        font-size: clamp(29px, 6.2vw, 40px);
      }

      .download-wrapper {
        margin-top: 26px;
      }

      .hero-visual-section {
        margin-top: 34px;
      }

      .hero-visual-grid {
        gap: 8px;
      }

      .hero-visual-card {
        border-radius: 20px;
      }
    }

    /* =========================================================
       12. Responsive / 일반 스마트폰
       ========================================================= */
    @media (max-width: 640px) {
      .nav-logo img {
        width: 116px;
      }

      .nav-menu {
        gap: 14px;
        font-size: 13px;
      }

      .hero {
        padding: 42px 0 44px;
      }

      .hero-title {
        font-size: clamp(26px, 8vw, 34px);
        line-height: 1.34;
      }

      .download-wrapper {
        margin-top: 26px;
      }

      .download-btn {
        width: 100%;
        max-width: 320px;
        min-height: 64px;
        padding-left: 21px;
        padding-right: 21px;
      }

      .download-note {
        max-width: 320px;
        margin-left: auto;
        margin-right: auto;
        word-break: keep-all;
      }

      .hero-visual-section {
        margin: 32px calc(50% - 50vw) 26px;
        overflow: hidden;
      }

      .hero-visual-grid {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 6px 16px 20px;
        scroll-snap-type: x mandatory;
        -webkit-overflow-scrolling: touch;
        animation: mobileSlideHint 1.1s ease 1.05s 1;
      }

      .hero-visual-grid::-webkit-scrollbar {
        display: none;
      }

      .hero-visual-card {
        flex: 0 0 78%;
        max-width: 380px;
        border-radius: 22px;
        scroll-snap-align: center;
      }

      @keyframes mobileSlideHint {
        0% {
          transform: translateX(0);
        }

        45% {
          transform: translateX(-18px);
        }

        100% {
          transform: translateX(0);
        }
      }
    }

    /* =========================================================
       13. Responsive / 매우 좁은 화면
       ========================================================= */
    @media (max-width: 380px) {
      .nav {
        padding-left: 14px;
        padding-right: 14px;
      }

      .nav-logo img {
        width: 108px;
      }

      .nav-menu {
        gap: 11px;
        font-size: 12px;
      }

      .container {
        padding: 0 16px;
      }

      .hero {
        padding: 36px 0 40px;
      }

      .hero-title {
        font-size: 24px;
        letter-spacing: -0.04em;
      }

      .download-btn {
        max-width: 280px;
        min-height: 60px;
        padding-left: 17px;
        padding-right: 17px;
      }

      .download-icon {
        width: 32px;
        height: 32px;
        font-size: 17px;
      }

      .download-btn-main {
        font-size: 16px;
      }

      .download-btn-sub {
        font-size: 11px;
      }

      .hero-visual-card {
        flex-basis: 84%;
      }

      footer {
        padding: 22px 14px;
      }
    }

    /* =========================================================
       14. Responsive / 가로모드 스마트폰
       ========================================================= */
    @media (max-height: 520px) and (orientation: landscape) {
      .hero {
        padding: 34px 0 36px;
      }

      .download-wrapper {
        margin-top: 22px;
      }

      .hero-visual-section {
        margin-top: 28px;
      }
    }
  </style>
</head>

  <script>
    /* =========================================================
       홈페이지 다운로드 버튼 직접 분기
       ========================================================= */
    function openModingStore(event) {
      const androidUrl =
        "https://play.google.com/store/apps/details?id=com.moding.application";

      const iosUrl =
        "https://apps.apple.com/kr/app/%EB%AA%A8%EB%94%A9-%EC%9A%B0%EB%A6%AC%EC%8B%9D%EB%8B%B9%EC%97%90-%ED%95%84%EC%9A%94%ED%95%9C-%ED%8A%B9%EC%88%98%EC%8B%9D%EC%9E%90%EC%9E%AC/id6772018982";

      const ua =
        navigator.userAgent ||
        navigator.vendor ||
        window.opera ||
        "";

      const platform = navigator.platform || "";

      const isAndroid = /android/i.test(ua);

      const isIOS =
        /iPhone|iPad|iPod/i.test(ua) ||
        (platform === "MacIntel" && navigator.maxTouchPoints > 1);

      if (isAndroid) {
        event.preventDefault();
        window.location.href = androidUrl;
        return false;
      }

      if (isIOS) {
        event.preventDefault();
        window.location.href = iosUrl;
        return false;
      }

      /* PC·태블릿 등 판별되지 않는 환경은 download.html로 이동 */
      return true;
    }

    /* =========================================================
       복사 / 드래그 방지
       ========================================================= */
    document.addEventListener("contextmenu", function (e) {
      if (!e.target.closest("input, textarea, a")) {
        e.preventDefault();
      }
    });

    document.addEventListener("dragstart", function (e) {
      if (!e.target.closest("input, textarea")) {
        e.preventDefault();
      }
    });

    document.addEventListener("keydown", function (e) {
      const key = e.key.toLowerCase();

      if ((e.ctrlKey || e.metaKey) && !e.target.closest("input, textarea")) {
        if (["c", "x", "v", "s", "u", "p", "a"].includes(key)) {
          e.preventDefault();
        }
      }
    });

    document.addEventListener("copy", function (e) {
      if (!e.target.closest("input, textarea")) {
        e.preventDefault();
      }
    });
  </script>
