  <script>
    const COUNTER_API_BASE =
      "https://flat-queen-f1fb.moding-inc.workers.dev";

    const ANDROID_URL =
      "https://play.google.com/store/apps/details?id=com.moding.application";

    const IOS_URL =
      "https://apps.apple.com/kr/app/%EB%AA%A8%EB%94%A9-%EC%9A%B0%EB%A6%AC%EC%8B%9D%EB%8B%B9%EC%97%90-%ED%95%84%EC%9A%94%ED%95%9C-%ED%8A%B9%EC%88%98%EC%8B%9D%EC%9E%90%EC%9E%AC/id6772018982";

    const SOURCE_SESSION_KEY =
      "moding_tracking_source";

    const VISITOR_ID_STORAGE_KEY =
      "moding_visitor_id_v1";

    const VISITOR_ID_SESSION_FALLBACK_KEY =
      "moding_visitor_id_session_v1";

    const TRACKED_STORE_PLATFORMS =
      new Set();

    const USER_AGENT =
      navigator.userAgent ||
      navigator.vendor ||
      window.opera ||
      "";

    const IS_BOT =
      /bot|crawl|crawler|spider|slurp|yeti|googlebot|bingbot|daumoa|ads-naver|blueno/i
        .test(USER_AGENT);

    const IS_ANDROID =
      /android/i.test(USER_AGENT);

    const IS_IOS =
      /iPhone|iPad|iPod/i.test(USER_AGENT) ||
      (
        navigator.platform === "MacIntel" &&
        navigator.maxTouchPoints > 1
      );

    const IS_MOBILE_STORE_TARGET =
      !IS_BOT &&
      (
        IS_ANDROID ||
        IS_IOS
      );

    function normalizeSource(value) {
      let source =
        String(value || "")
          .trim()
          .toLowerCase()
          .replace(/[^a-z0-9_-]/g, "")
          .slice(0, 50);

      if (!source) {
        return "";
      }

      const aliases = {
        none: "direct",
        organic_direct: "direct",

        karrot: "daangn",
        danggeun: "daangn",
        daangn_market: "daangn",
        karrotmarket: "daangn",

        naverblog: "naver_blog",
        blog_naver: "naver_blog",

        navercafe: "naver_cafe",
        cafe_naver: "naver_cafe",

        naverplace: "naver_place",
        smartplace: "naver_place",
        naver_smartplace: "naver_place",

        naversearch: "naver_search",
        "naver-search": "naver_search",
        naverorganic: "naver_search",
        naver_organic: "naver_search",

        kakaotalk: "kakao",
        kakao_talk: "kakao",

        insta: "instagram",
        fb: "facebook",
        twitter: "x",
        yt: "youtube",

        flyer: "leaflet",
        offline_flyer: "leaflet",
        pamphlet: "leaflet",

        qrcode: "qr",

        googleplay: "google_play",
        playstore: "google_play",

        appstore: "app_store",
        apple: "app_store"
      };

      return aliases[source] || source;
    }

    function isNaverSearchReferrer(
      refUrl,
      host
    ) {
      if (
        host === "search.naver.com" ||
        host.endsWith(
          ".search.naver.com"
        )
      ) {
        return true;
      }

      const isNaverHost =
        host === "naver.com" ||
        host.endsWith(
          ".naver.com"
        );

      if (!isNaverHost) {
        return false;
      }

      const path =
        String(
          refUrl.pathname || ""
        ).toLowerCase();

      return (
        path.includes(
          "/search.naver"
        ) ||
        path.startsWith(
          "/search/"
        ) ||
        refUrl.searchParams.has(
          "query"
        ) ||
        refUrl.searchParams.has(
          "where"
        )
      );
    }

    function getReferrerInfo() {
      const referrer =
        String(
          document.referrer || ""
        ).trim();

      if (!referrer) {
        return {
          source: "",
          isModing: false
        };
      }

      try {
        const refUrl =
          new URL(referrer);

        const querySource =
          refUrl.searchParams.get("source") ||
          refUrl.searchParams.get("src") ||
          refUrl.searchParams.get("utm_source");

        const host =
          String(
            refUrl.hostname || ""
          )
            .toLowerCase()
            .replace(/^www\./, "");

        const isModing =
          host === "moding.app" ||
          host.endsWith(".moding.app");

        if (querySource) {
          return {
            source:
              normalizeSource(querySource),
            isModing
          };
        }

        if (isModing) {
          return {
            source: "",
            isModing: true
          };
        }

        if (
          host.includes("daangn.com") ||
          host.includes("karrotmarket.com") ||
          host.includes("karrot.com")
        ) {
          return {
            source: "daangn",
            isModing: false
          };
        }

        if (
          host === "blog.naver.com" ||
          host.endsWith(
            ".blog.naver.com"
          )
        ) {
          return {
            source: "naver_blog",
            isModing: false
          };
        }

        if (
          host === "cafe.naver.com" ||
          host.endsWith(
            ".cafe.naver.com"
          )
        ) {
          return {
            source: "naver_cafe",
            isModing: false
          };
        }

        if (
          host === "place.naver.com" ||
          host.endsWith(
            ".place.naver.com"
          )
        ) {
          return {
            source: "naver_place",
            isModing: false
          };
        }

        if (
          isNaverSearchReferrer(
            refUrl,
            host
          )
        ) {
          return {
            source: "naver_search",
            isModing: false
          };
        }

        if (
          host === "naver.com" ||
          host.endsWith(".naver.com") ||
          host === "naver.me"
        ) {
          return {
            source: "naver",
            isModing: false
          };
        }

        if (
          host === "kakao.com" ||
          host.endsWith(".kakao.com") ||
          host === "kakaocorp.com" ||
          host.endsWith(".kakaocorp.com") ||
          host === "daum.net" ||
          host.endsWith(".daum.net")
        ) {
          return {
            source: "kakao",
            isModing: false
          };
        }

        if (
          host === "google.com" ||
          host.endsWith(".google.com") ||
          /^google\.[a-z.]+$/.test(host)
        ) {
          return {
            source: "google",
            isModing: false
          };
        }

        if (
          host === "youtube.com" ||
          host.endsWith(".youtube.com") ||
          host === "youtu.be"
        ) {
          return {
            source: "youtube",
            isModing: false
          };
        }

        if (
          host === "instagram.com" ||
          host.endsWith(".instagram.com")
        ) {
          return {
            source: "instagram",
            isModing: false
          };
        }

        if (
          host === "facebook.com" ||
          host.endsWith(".facebook.com") ||
          host === "fb.com" ||
          host.endsWith(".fb.com")
        ) {
          return {
            source: "facebook",
            isModing: false
          };
        }

        if (
          host === "x.com" ||
          host.endsWith(".x.com") ||
          host === "twitter.com" ||
          host.endsWith(".twitter.com") ||
          host === "t.co"
        ) {
          return {
            source: "x",
            isModing: false
          };
        }

        return {
          source: "referral",
          isModing: false
        };

      } catch (_) {
        return {
          source: "",
          isModing: false
        };
      }
    }

    const REFERRER_INFO =
      getReferrerInfo();

    function getTrafficSource() {
      const params =
        new URLSearchParams(
          window.location.search
        );

      const explicitSource =
        normalizeSource(
          params.get("source") ||
          params.get("src") ||
          params.get("utm_source")
        );

      if (explicitSource) {
        try {
          sessionStorage.setItem(
            SOURCE_SESSION_KEY,
            explicitSource
          );
        } catch (_) {}

        return explicitSource;
      }

      try {
        const savedSource =
          normalizeSource(
            sessionStorage.getItem(
              SOURCE_SESSION_KEY
            )
          );

        if (savedSource) {
          return savedSource;
        }
      } catch (_) {}

      if (REFERRER_INFO.source) {
        try {
          sessionStorage.setItem(
            SOURCE_SESSION_KEY,
            REFERRER_INFO.source
          );
        } catch (_) {}

        return REFERRER_INFO.source;
      }

      try {
        sessionStorage.setItem(
          SOURCE_SESSION_KEY,
          "direct"
        );
      } catch (_) {}

      return "direct";
    }

    function isValidVisitorId(value) {
      return /^[a-zA-Z0-9_-]{16,200}$/.test(
        String(value || "")
      );
    }

    function createVisitorId() {
      try {
        if (
          window.crypto &&
          typeof window.crypto.randomUUID ===
            "function"
        ) {
          return (
            "mv_" +
            window.crypto
              .randomUUID()
              .replace(/-/g, "")
          );
        }
      } catch (_) {}

      try {
        if (
          window.crypto &&
          typeof window.crypto.getRandomValues ===
            "function"
        ) {
          const bytes =
            new Uint8Array(16);

          window.crypto.getRandomValues(
            bytes
          );

          const randomPart =
            Array.from(bytes)
              .map((value) =>
                value
                  .toString(16)
                  .padStart(2, "0")
              )
              .join("");

          return (
            "mv_" +
            Date.now().toString(36) +
            "_" +
            randomPart
          );
        }
      } catch (_) {}

      return (
        "mv_" +
        Date.now().toString(36) +
        "_" +
        Math.random()
          .toString(36)
          .slice(2) +
        Math.random()
          .toString(36)
          .slice(2)
      );
    }

    function getOrCreateVisitorId() {
      try {
        const stored =
          localStorage.getItem(
            VISITOR_ID_STORAGE_KEY
          );

        if (isValidVisitorId(stored)) {
          return stored;
        }

        const created =
          createVisitorId();

        localStorage.setItem(
          VISITOR_ID_STORAGE_KEY,
          created
        );

        return created;
      } catch (_) {}

      try {
        const stored =
          sessionStorage.getItem(
            VISITOR_ID_SESSION_FALLBACK_KEY
          );

        if (isValidVisitorId(stored)) {
          return stored;
        }

        const created =
          createVisitorId();

        sessionStorage.setItem(
          VISITOR_ID_SESSION_FALLBACK_KEY,
          created
        );

        return created;
      } catch (_) {}

      return createVisitorId();
    }

    const ACTIVE_TRACKING =
      window.ModingTracking || {};

    const TRAFFIC_SOURCE =
      normalizeSource(
        ACTIVE_TRACKING.source
      ) ||
      getTrafficSource();

    const SOURCE_METHOD =
      [
        "tagged",
        "referrer",
        "persisted",
        "in_app",
        "direct"
      ].includes(
        ACTIVE_TRACKING.sourceMethod
      )
        ? ACTIVE_TRACKING.sourceMethod
        : TRAFFIC_SOURCE === "direct"
          ? "direct"
          : "legacy";

    const CAMPAIGN_ID =
      String(
        ACTIVE_TRACKING.campaignId || ""
      )
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9._-]/g, "")
        .slice(0, 100);

    const REFERRER_HOST =
      String(
        ACTIVE_TRACKING.referrerHost || ""
      )
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9.-]/g, "")
        .slice(0, 120);

    const MODING_VISITOR_ID =
      isValidVisitorId(
        ACTIVE_TRACKING.visitorId
      )
        ? ACTIVE_TRACKING.visitorId
        : getOrCreateVisitorId();

    function markStoreRedirectOnce(
      platform
    ) {
      const normalizedPlatform =
        platform === "android"
          ? "android"
          : platform === "ios"
            ? "ios"
            : "unknown";

      if (
        TRACKED_STORE_PLATFORMS.has(
          normalizedPlatform
        )
      ) {
        return false;
      }

      TRACKED_STORE_PLATFORMS.add(
        normalizedPlatform
      );

      return true;
    }

    function trackStoreRedirect(
      platform
    ) {
      if (
        !markStoreRedirectOnce(
          platform
        )
      ) {
        return false;
      }

      const trackingUrl =
        `${COUNTER_API_BASE}/track/download` +
        `?platform=${encodeURIComponent(platform)}` +
        `&src=${encodeURIComponent(TRAFFIC_SOURCE)}` +
        `&sourceMethod=${encodeURIComponent(SOURCE_METHOD)}` +
        `&campaignId=${encodeURIComponent(CAMPAIGN_ID)}` +
        `&referrerHost=${encodeURIComponent(REFERRER_HOST)}` +
        `&landingPage=${encodeURIComponent(ACTIVE_TRACKING.landingPage || window.location.pathname || "/download.html")}` +
        `&visitorId=${encodeURIComponent(MODING_VISITOR_ID)}`;

      try {
        if (
          typeof navigator.sendBeacon ===
          "function"
        ) {
          const sent =
            navigator.sendBeacon(
              trackingUrl,
              ""
            );

          if (sent) {
            return true;
          }
        }
      } catch (_) {}

      try {
        fetch(
          trackingUrl,
          {
            method: "POST",
            mode: "cors",
            keepalive: true,
            cache: "no-store"
          }
        ).catch(() => {});
      } catch (_) {}

      return true;
    }

    function redirectToStore(
      platform,
      storeUrl
    ) {
      trackStoreRedirect(
        platform
      );

      window.location.replace(
        storeUrl
      );
    }

    if (
      !IS_BOT &&
      IS_ANDROID
    ) {
      redirectToStore(
        "android",
        ANDROID_URL
      );

    } else if (
      !IS_BOT &&
      IS_IOS
    ) {
      redirectToStore(
        "ios",
        IOS_URL
      );

    } else {
      document.documentElement
        .style
        .visibility =
        "visible";
    }

    if (
      IS_MOBILE_STORE_TARGET
    ) {
      window.setTimeout(
        () => {
          document.documentElement
            .style
            .visibility =
            "visible";
        },
        2500
      );
    }
  </script>

</head>

<body>

      );

    iosDownloadButton

        () => {
          trackStoreRedirect(
