  <!-- =========================================================
       05. 모바일 자동분기 + 외부채널 추적
       ========================================================= -->
  <script>
    /* =========================================================
       Worker / Store 주소
       ========================================================= */

    const TRACK_API =
      "https://flat-queen-f1fb.moding-inc.workers.dev/track/redirect";


    const ANDROID_URL =
      "https://play.google.com/store/apps/details?id=com.moding.application";


    const IOS_URL =
      "https://apps.apple.com/kr/app/%EB%AA%A8%EB%94%A9-%EC%9A%B0%EB%A6%AC%EC%8B%9D%EB%8B%B9%EC%97%90-%ED%95%84%EC%9A%94%ED%95%9C-%ED%8A%B9%EC%88%98%EC%8B%9D%EC%9E%90%EC%9E%AC/id6772018982";


    /* =========================================================
       User Agent
       ========================================================= */

    const USER_AGENT =
      navigator.userAgent ||
      navigator.vendor ||
      window.opera ||
      "";


    /* =========================================================
       검색로봇

       검색로봇은 스토어로 보내지 않고
       다운로드 페이지 내용을 읽도록 유지
       ========================================================= */

    const IS_BOT =
      /bot|crawl|crawler|spider|slurp|yeti|googlebot|bingbot|daumoa|ads-naver|blueno/i
        .test(
          USER_AGENT
        );


    /* =========================================================
       Android
       ========================================================= */

    const IS_ANDROID =
      /android/i.test(
        USER_AGENT
      );


    /* =========================================================
       iPhone / iPad

       iPadOS가 MacIntel로 표시되는 경우 포함
       ========================================================= */

    const IS_IOS =
      /iPhone|iPad|iPod/i.test(
        USER_AGENT
      ) ||
      (
        navigator.platform === "MacIntel" &&
        navigator.maxTouchPoints > 1
      );


    /* =========================================================
       모바일 자동분기 대상
       ========================================================= */

    const IS_MOBILE_STORE_TARGET =
      !IS_BOT &&
      (
        IS_ANDROID ||
        IS_IOS
      );


    /* =========================================================
       Source 정리

       사용 예:

       당근
       ?src=daangn

       네이버 카페
       ?src=naver_cafe

       네이버 블로그
       ?src=naver_blog

       카카오
       ?src=kakao

       유튜브
       ?src=youtube

       전단
       ?src=leaflet
       ========================================================= */

    function normalizeSource(
      value
    ) {
      let source =
        String(
          value ||
          ""
        )
          .trim()
          .toLowerCase()
          .replace(
            /[^a-z0-9_-]/g,
            ""
          )
          .slice(
            0,
            50
          );


      if (
        !source
      ) {
        return "";
      }


      /*
       * 당근 별칭 통일
       */
      if (
        source === "karrot" ||
        source === "danggeun"
      ) {
        return "daangn";
      }


      return source;
    }


    /* =========================================================
       Referrer 기반 보조 판별

       src 파라미터가 없을 때만 사용
       ========================================================= */

    function detectReferrerSource() {
      const referrer =
        document.referrer ||
        "";


      if (
        !referrer
      ) {
        return "";
      }


      try {
        const hostname =
          new URL(
            referrer
          )
            .hostname
            .toLowerCase();


        if (
          hostname.includes(
            "daangn"
          ) ||
          hostname.includes(
            "karrot"
          )
        ) {
          return "daangn";
        }


        if (
          hostname.includes(
            "naver"
          )
        ) {
          return "naver";
        }


        if (
          hostname.includes(
            "kakao"
          ) ||
          hostname.includes(
            "daum"
          )
        ) {
          return "kakao";
        }


        if (
          hostname.includes(
            "youtube"
          ) ||
          hostname.includes(
            "youtu.be"
          )
        ) {
          return "youtube";
        }


        if (
          hostname.includes(
            "instagram"
          )
        ) {
          return "instagram";
        }


        if (
          hostname.includes(
            "facebook"
          )
        ) {
          return "facebook";
        }


        if (
          hostname.includes(
            "google"
          )
        ) {
          return "google";
        }


        return "referral";

      } catch (_) {
        return "";
      }
    }


    /* =========================================================
       최종 Source

       우선순위:

       1. ?src=
       2. ?utm_source=
       3. referrer
       4. direct

       중요:
       sessionStorage를 사용하지 않습니다.

       과거 당근 접속값이 이후 직접접속까지
       당근으로 남는 오염을 방지합니다.
       ========================================================= */

    function getTrafficSource() {
      const params =
        new URLSearchParams(
          window.location.search
        );


      const explicitSource =
        normalizeSource(
          params.get(
            "src"
          ) ||
          params.get(
            "utm_source"
          )
        );


      if (
        explicitSource
      ) {
        return explicitSource;
      }


      const referrerSource =
        detectReferrerSource();


      if (
        referrerSource
      ) {
        return referrerSource;
      }


      return "direct";
    }


    const TRAFFIC_SOURCE =
      getTrafficSource();


    /* =========================================================
       Store Redirect 카운팅

       /track/download 아님

       /track/redirect 사용

       즉:
       이 이벤트는 홈페이지 다운로드 클릭에
       더 이상 포함되지 않습니다.
       ========================================================= */

    function trackStoreRedirect(
      platform
    ) {
      const trackingUrl =
        TRACK_API +
        "?platform=" +
        encodeURIComponent(
          platform
        ) +
        "&src=" +
        encodeURIComponent(
          TRAFFIC_SOURCE
        );


      /* ---------------------------------------------------------
         1순위: sendBeacon

         페이지가 즉시 외부 스토어로 이동하는 상황의
         이벤트 전송에 적합
         --------------------------------------------------------- */

      try {
        if (
          typeof navigator.sendBeacon ===
          "function"
        ) {
          const sent =
            navigator.sendBeacon(
              trackingUrl,
              ""
            );


          if (
            sent
          ) {
            return;
          }
        }

      } catch (_) {}


      /* ---------------------------------------------------------
         2순위: fetch + keepalive
         --------------------------------------------------------- */

      try {
        fetch(
          trackingUrl,
          {
            method:
              "POST",

            keepalive:
              true,

            cache:
              "no-store"
          }
        )
          .catch(
            () => {}
          );

      } catch (_) {}
    }


    /* =========================================================
       Store 즉시 이동

       카운팅 완료를 기다리지 않음
       ========================================================= */

    function redirectToStore(
      platform,
      storeUrl
    ) {
      trackStoreRedirect(
        platform
      );


      window.location.replace(
        storeUrl
      );
    }


    /* =========================================================
       모바일 자동분기

       Android
       → Google Play

       iPhone / iPad
       → App Store

       정상 모바일에서는
       download.html 화면을 한 번도 표시하지 않음
       ========================================================= */

    if (
      !IS_BOT &&
      IS_ANDROID
    ) {
      redirectToStore(
        "android",
        ANDROID_URL
      );


    } else if (
      !IS_BOT &&
      IS_IOS
    ) {
      redirectToStore(
        "ios",
        IOS_URL
      );


    } else {
      /*
       * Windows PC
       * 일반 Mac
       * 검색로봇
       *
       * 이 경우만 download.html 표시
       */
      document.documentElement
        .style
        .visibility =
        "visible";
    }


    /* =========================================================
       모바일 Store 호출 실패 대비

       정상적으로 스토어가 열리면
       이미 페이지를 떠났으므로 실행되지 않습니다.

       일부 특수 인앱브라우저에서
       App Store / Play Store 호출이 막힌 경우에만
       2.5초 뒤 수동 선택 화면 표시
       ========================================================= */

    if (
      IS_MOBILE_STORE_TARGET
    ) {
      window.setTimeout(
        () => {
          document.documentElement
            .style
            .visibility =
            "visible";
        },
        2500
      );
    }
  </script>

       ========================================================= -->

    const androidDownloadButton =

        .addEventListener(

            trackStoreRedirect(
