<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Moding Growth Studio</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#238B22">
  <link rel="canonical" href="https://moding.app/studio/">
  <meta
    http-equiv="refresh"
    content="0; url=https://moding-channel-studio.modooboss.chatgpt.site/"
  >
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f4f7f4;
      color: #173119;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 440px);
      padding: 38px 28px;
      border: 1px solid #e2e8e2;
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 18px 50px rgba(23, 49, 25, 0.08);
    }

    .mark {
      width: 58px;
      height: 58px;
      margin: 0 auto 22px;
      display: grid;
      place-items: center;
      border-radius: 18px;
      background: #238b22;
      color: #fff;
      font-size: 28px;
      font-weight: 950;
    }

    .kicker {
      margin: 0 0 12px;
      color: #238b22;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.16em;
    }

    h1 {
      margin: 0;
      font-size: clamp(27px, 8vw, 36px);
      line-height: 1.2;
      letter-spacing: -0.05em;
    }

    p {
      margin: 14px 0 24px;
      color: #687269;
      font-size: 14px;
      line-height: 1.65;
      font-weight: 650;
    }

    a {
      min-height: 50px;
      padding: 0 20px;
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #238b22;
      color: #fff;
      text-decoration: none;
      font-size: 14px;
      font-weight: 900;
    }
  </style>
  <script>
    window.location.replace(
      "https://moding-channel-studio.modooboss.chatgpt.site/"
    );
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">M</div>
    <div class="kicker">MODING GROWTH STUDIO</div>
    <h1>모딩 스튜디오로<br>이동하고 있습니다</h1>
    <p>자동으로 이동하지 않으면 아래 버튼을 눌러주세요</p>
    <a href="https://moding-channel-studio.modooboss.chatgpt.site/">
      모딩 스튜디오로 이동하기
    </a>
  </main>
</body>
</html>
