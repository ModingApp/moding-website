<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Moding Admin</title>

  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta name="googlebot" content="noindex,nofollow,noarchive">

  <style>
    :root {
      --green: #238B22;
      --green-dark: #1C6F1C;
      --orange: #FF8C00;
      --black: #090B09;
      --ink: #173119;
      --sub: #687269;
      --line: #E3E9E3;
      --soft: #F4F7F4;
      --white: #FFFFFF;
      --danger: #C74848;
      --page-max: 1120px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      background: var(--soft);
      color: var(--ink);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans KR",
        "Apple SD Gothic Neo",
        sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    body {
      min-height: 100dvh;
    }

    button,
    input {
      font: inherit;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    img {
      display: block;
      max-width: 100%;
      height: auto;
    }

    [hidden] {
      display: none !important;
    }

    /* =========================================================
       01 HEADER
       ========================================================= */
    .admin-header {
      width: 100%;
      background: #fff;
      border-bottom: 1px solid var(--line);
    }

    .admin-header-inner {
      width: min(100% - 40px, var(--page-max));
      min-height: 78px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 13px;
      color: var(--green);
      text-decoration: none;
    }

    .brand img {
      width: auto;
      height: 44px;
      object-fit: contain;
    }

    .brand-badge {
      min-height: 27px;
      padding: 0 10px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 999px;
      background: var(--black);
      color: #fff;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .admin-home {
      color: var(--sub);
      font-size: 13px;
      font-weight: 800;
      text-decoration: none;
    }

    .admin-home:hover {
      color: var(--orange);
    }

    /* =========================================================
       02 LOGIN
       ========================================================= */
    .login-shell {
      min-height: calc(100dvh - 79px);
      padding: 52px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-card {
      width: min(100%, 430px);
      padding: 38px 34px 32px;
      border: 1px solid var(--line);
      border-radius: 28px;
      background: #fff;
      box-shadow: 0 22px 60px rgba(23,49,25,.08);
    }

    .login-kicker {
      color: var(--orange);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .16em;
    }

    .login-title {
      margin-top: 13px;
      font-size: 34px;
      line-height: 1.08;
      letter-spacing: -.055em;
      font-weight: 950;
    }

    .login-desc {
      margin-top: 13px;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.6;
      font-weight: 650;
    }

    .login-form {
      margin-top: 28px;
    }

    .password-wrap {
      position: relative;
    }

    .password-input {
      width: 100%;
      height: 56px;
      padding: 0 52px 0 16px;
      border: 1px solid var(--line);
      border-radius: 16px;
      outline: none;
      background: #fff;
      color: var(--ink);
      font-size: 16px;
      font-weight: 800;
      transition:
        border-color .18s ease,
        box-shadow .18s ease;
    }

    .password-input:focus {
      border-color: rgba(35,139,34,.55);
      box-shadow: 0 0 0 4px rgba(35,139,34,.08);
    }

    .password-toggle {
      position: absolute;
      top: 50%;
      right: 8px;
      width: 40px;
      height: 40px;
      transform: translateY(-50%);
      border: 0;
      border-radius: 12px;
      background: transparent;
      color: var(--sub);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .login-submit {
      width: 100%;
      min-height: 54px;
      margin-top: 12px;
      border: 0;
      border-radius: 16px;
      background: var(--green);
      color: #fff;
      font-size: 15px;
      font-weight: 950;
      cursor: pointer;
      transition:
        transform .18s ease,
        background .18s ease;
    }

    .login-submit:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
    }

    .login-submit:disabled {
      opacity: .55;
      cursor: wait;
      transform: none;
    }

    .login-error {
      min-height: 20px;
      margin-top: 12px;
      color: var(--danger);
      font-size: 12.5px;
      line-height: 1.5;
      font-weight: 800;
    }

    /* =========================================================
       03 DASHBOARD
       ========================================================= */
    .dashboard {
      width: min(100% - 40px, var(--page-max));
      margin: 0 auto;
      padding: 42px 0 64px;
    }

    .dashboard-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 24px;
    }

    .dashboard-kicker {
      color: var(--orange);
      font-size: 11px;
      font-weight: 950;
      letter-spacing: .16em;
    }

    .dashboard-title {
      margin-top: 9px;
      font-size: clamp(34px, 5vw, 58px);
      line-height: 1.04;
      letter-spacing: -.06em;
      font-weight: 950;
    }

    .dashboard-desc {
      margin-top: 12px;
      color: var(--sub);
      font-size: 14px;
      line-height: 1.6;
      font-weight: 650;
    }

    .logout-btn {
      flex: 0 0 auto;
      min-height: 42px;
      padding: 0 16px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: #fff;
      color: var(--sub);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .logout-btn:hover {
      color: var(--orange);
      border-color: rgba(255,140,0,.28);
    }

    /* =========================================================
       04 STATS
       ========================================================= */
    .stat-grid {
      margin-top: 32px;
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .stat-card {
      min-height: 176px;
      padding: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: #fff;
    }

    .stat-card.primary {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    .stat-card.download {
      border-color: rgba(255,140,0,.22);
    }

    .stat-label {
      color: var(--sub);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: -.015em;
    }

    .primary .stat-label {
      color: rgba(255,255,255,.72);
    }

    .stat-value {
      margin-top: 18px;
      font-size: clamp(38px, 5vw, 56px);
      line-height: 1;
      letter-spacing: -.055em;
      font-weight: 950;
    }

    .download .stat-value {
      color: var(--orange);
    }

    .stat-unit {
      margin-left: 3px;
      font-size: 14px;
      font-weight: 900;
    }

    .stat-sub {
      margin-top: 10px;
      color: var(--sub);
      font-size: 11.5px;
      line-height: 1.5;
      font-weight: 700;
    }

    .primary .stat-sub {
      color: rgba(255,255,255,.68);
    }

    /* =========================================================
       05 7 DAY TABLE
       ========================================================= */
    .history-card {
      margin-top: 18px;
      padding: 26px;
      border: 1px solid var(--line);
      border-radius: 26px;
      background: #fff;
    }

    .history-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .history-title {
      font-size: 20px;
      font-weight: 950;
      letter-spacing: -.04em;
    }

    .refresh-btn {
      min-height: 38px;
      padding: 0 14px;
      border: 0;
      border-radius: 999px;
      background: var(--soft);
      color: var(--green);
      font-size: 12px;
      font-weight: 900;
      cursor: pointer;
    }

    .refresh-btn:disabled {
      opacity: .5;
      cursor: wait;
    }

    .history-table-wrap {
      margin-top: 18px;
      overflow-x: auto;
      border-top: 1px solid var(--line);
    }

    .history-table {
      width: 100%;
      min-width: 540px;
      border-collapse: collapse;
    }

    .history-table th,
    .history-table td {
      padding: 16px 10px;
      border-bottom: 1px solid var(--line);
      text-align: right;
      font-size: 13px;
    }

    .history-table th {
      color: var(--sub);
      font-size: 11px;
      font-weight: 900;
    }

    .history-table th:first-child,
    .history-table td:first-child {
      text-align: left;
    }

    .history-table td {
      color: var(--ink);
      font-weight: 800;
    }

    .history-table td.download-count {
      color: var(--orange);
    }

    .history-empty {
      padding: 34px 0 16px;
      color: var(--sub);
      text-align: center;
      font-size: 13px;
      font-weight: 750;
    }

    /* =========================================================
       06 STATUS
       ========================================================= */
    .status-line {
      margin-top: 18px;
      min-height: 20px;
      color: var(--sub);
      font-size: 11.5px;
      line-height: 1.5;
      font-weight: 700;
    }

    .status-line.error {
      color: var(--danger);
    }

    /* =========================================================
       07 RESPONSIVE
       ========================================================= */
    @media (max-width: 900px) {
      .stat-grid {
        grid-template-columns: repeat(2, minmax(0,1fr));
      }
    }

    @media (max-width: 620px) {
      .admin-header-inner,
      .dashboard {
        width: min(100% - 28px, var(--page-max));
      }

      .admin-header-inner {
        min-height: 70px;
      }

      .brand img {
        height: 39px;
      }

      .brand-badge {
        min-height: 24px;
        padding: 0 8px;
        font-size: 10px;
      }

      .login-shell {
        min-height: calc(100dvh - 71px);
        padding: 28px 14px;
      }

      .login-card {
        padding: 30px 22px 25px;
        border-radius: 24px;
      }

      .login-title {
        font-size: 30px;
      }

      .dashboard {
        padding-top: 28px;
      }

      .dashboard-head {
        align-items: flex-start;
      }

      .dashboard-desc {
        max-width: 260px;
      }

      .stat-grid {
        margin-top: 24px;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .stat-card {
        min-height: 142px;
        padding: 17px;
        border-radius: 20px;
      }

      .stat-value {
        font-size: 38px;
      }

      .history-card {
        padding: 20px 16px;
        border-radius: 22px;
      }
    }

    @media (max-width: 390px) {
      .admin-header-inner,
      .dashboard {
        width: min(100% - 22px, var(--page-max));
      }

      .brand {
        gap: 8px;
      }

      .brand img {
        height: 36px;
      }

      .admin-home {
        font-size: 11px;
      }

      .stat-card {
        min-height: 132px;
        padding: 15px;
      }

      .stat-label {
        font-size: 11px;
      }

      .stat-value {
        font-size: 34px;
      }

      .stat-sub {
        font-size: 10.5px;
      }
    }
  </style>
</head>

<body>
  <header class="admin-header">
    <div class="admin-header-inner">
      <a class="brand" href="index.html" aria-label="모딩 홈">
        <img src="모딩로고.png" alt="Moding">
        <span class="brand-badge">ADMIN</span>
      </a>

      <a class="admin-home" href="index.html">
        홈페이지로
      </a>
    </div>
  </header>

  <!-- LOGIN -->
  <main id="loginView" class="login-shell">
    <section class="login-card" aria-labelledby="loginTitle">
      <div class="login-kicker">MODING ADMIN</div>

      <h1 id="loginTitle" class="login-title">
        관리자 확인
      </h1>

      <p class="login-desc">
        관리자 비밀번호를 입력하면<br>
        홈페이지 방문 및 다운로드 현황을 확인할 수 있습니다.
      </p>

      <form id="loginForm" class="login-form">
        <div class="password-wrap">
          <input
            id="passwordInput"
            class="password-input"
            type="password"
            name="password"
            placeholder="관리자 비밀번호"
            autocomplete="current-password"
            required
          >

          <button
            id="passwordToggle"
            class="password-toggle"
            type="button"
            aria-label="비밀번호 표시 전환"
          >
            보기
          </button>
        </div>

        <button
          id="loginSubmit"
          class="login-submit"
          type="submit"
        >
          관리자 페이지 들어가기
        </button>

        <div
          id="loginError"
          class="login-error"
          role="alert"
          aria-live="polite"
        ></div>
      </form>
    </section>
  </main>

  <!-- DASHBOARD -->
  <main id="dashboardView" class="dashboard" hidden>
    <div class="dashboard-head">
      <div>
        <div class="dashboard-kicker">MODING WEBSITE</div>

        <h1 class="dashboard-title">
          방문 현황
        </h1>

        <p class="dashboard-desc">
          인덱스 진입과 앱 다운로드 클릭만 간단하게 확인합니다.
        </p>
      </div>

      <button
        id="logoutBtn"
        class="logout-btn"
        type="button"
      >
        로그아웃
      </button>
    </div>

    <section class="stat-grid" aria-label="주요 통계">
      <article class="stat-card primary">
        <div>
          <div class="stat-label">오늘 인덱스 방문</div>
          <div class="stat-value">
            <span id="todayVisits">0</span>
            <span class="stat-unit">회</span>
          </div>
        </div>
        <div class="stat-sub">오늘 홈페이지 첫 진입 기준</div>
      </article>

      <article class="stat-card download">
        <div>
          <div class="stat-label">오늘 다운로드 클릭</div>
          <div class="stat-value">
            <span id="todayDownloads">0</span>
            <span class="stat-unit">회</span>
          </div>
        </div>
        <div class="stat-sub">모딩 앱 다운로드 버튼 클릭</div>
      </article>

      <article class="stat-card">
        <div>
          <div class="stat-label">누적 인덱스 방문</div>
          <div class="stat-value">
            <span id="totalVisits">0</span>
            <span class="stat-unit">회</span>
          </div>
        </div>
        <div class="stat-sub">전체 누적 방문 횟수</div>
      </article>

      <article class="stat-card download">
        <div>
          <div class="stat-label">누적 다운로드 클릭</div>
          <div class="stat-value">
            <span id="totalDownloads">0</span>
            <span class="stat-unit">회</span>
          </div>
        </div>
        <div class="stat-sub">전체 누적 다운로드 클릭</div>
      </article>
    </section>

    <section class="history-card">
      <div class="history-head">
        <h2 class="history-title">최근 7일</h2>

        <button
          id="refreshBtn"
          class="refresh-btn"
          type="button"
        >
          새로고침
        </button>
      </div>

      <div class="history-table-wrap">
        <table class="history-table">
          <thead>
            <tr>
              <th scope="col">날짜</th>
              <th scope="col">인덱스 방문</th>
              <th scope="col">다운로드 클릭</th>
            </tr>
          </thead>

          <tbody id="historyBody"></tbody>
        </table>

        <div
          id="historyEmpty"
          class="history-empty"
          hidden
        >
          아직 집계된 데이터가 없습니다.
        </div>
      </div>
    </section>

    <div
      id="dashboardStatus"
      class="status-line"
      aria-live="polite"
    ></div>
  </main>

  <script>
    /* =========================================================
       01 API CONFIG
       서버/API를 만든 뒤 이 주소만 바꾸면 됩니다.
       예: https://counter.moding.app
       ========================================================= */
    const API_BASE = "https://YOUR-COUNTER-API.example.com";

    const ENDPOINTS = {
      login: "/admin/login",
      stats: "/admin/stats",
      logout: "/admin/logout"
    };

    const SESSION_TOKEN_KEY = "moding_admin_token";

    /* =========================================================
       02 DOM
       ========================================================= */
    const loginView = document.getElementById("loginView");
    const dashboardView = document.getElementById("dashboardView");

    const loginForm = document.getElementById("loginForm");
    const passwordInput = document.getElementById("passwordInput");
    const passwordToggle = document.getElementById("passwordToggle");
    const loginSubmit = document.getElementById("loginSubmit");
    const loginError = document.getElementById("loginError");

    const todayVisits = document.getElementById("todayVisits");
    const todayDownloads = document.getElementById("todayDownloads");
    const totalVisits = document.getElementById("totalVisits");
    const totalDownloads = document.getElementById("totalDownloads");

    const historyBody = document.getElementById("historyBody");
    const historyEmpty = document.getElementById("historyEmpty");
    const refreshBtn = document.getElementById("refreshBtn");
    const logoutBtn = document.getElementById("logoutBtn");
    const dashboardStatus = document.getElementById("dashboardStatus");

    /* =========================================================
       03 HELPERS
       ========================================================= */
    function apiUrl(path) {
      return `${API_BASE.replace(/\/$/, "")}${path}`;
    }

    function getToken() {
      return sessionStorage.getItem(SESSION_TOKEN_KEY);
    }

    function saveToken(token) {
      sessionStorage.setItem(SESSION_TOKEN_KEY, token);
    }

    function clearToken() {
      sessionStorage.removeItem(SESSION_TOKEN_KEY);
    }

    function formatNumber(value) {
      const number = Number(value || 0);
      return Number.isFinite(number)
        ? number.toLocaleString("ko-KR")
        : "0";
    }

    function formatDate(dateString) {
      if (!dateString) return "-";

      const date = new Date(`${dateString}T00:00:00`);

      if (Number.isNaN(date.getTime())) {
        return dateString;
      }

      return new Intl.DateTimeFormat(
        "ko-KR",
        {
          month: "numeric",
          day: "numeric",
          weekday: "short"
        }
      ).format(date);
    }

    function isApiConfigured() {
      return !API_BASE.includes("YOUR-COUNTER-API");
    }

    function showLogin() {
      dashboardView.hidden = true;
      loginView.hidden = false;
      passwordInput.focus();
    }

    function showDashboard() {
      loginView.hidden = true;
      dashboardView.hidden = false;
    }

    function setDashboardStatus(message, isError = false) {
      dashboardStatus.textContent = message;
      dashboardStatus.classList.toggle("error", isError);
    }

    /* =========================================================
       04 PASSWORD VISIBILITY
       ========================================================= */
    passwordToggle.addEventListener("click", () => {
      const isPassword =
        passwordInput.type === "password";

      passwordInput.type =
        isPassword ? "text" : "password";

      passwordToggle.textContent =
        isPassword ? "숨김" : "보기";
    });

    /* =========================================================
       05 LOGIN
       POST /admin/login
       request  : { password }
       response : { token }
       ========================================================= */
    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      loginError.textContent = "";

      if (!isApiConfigured()) {
        loginError.textContent =
          "카운터 API 주소가 아직 연결되지 않았습니다.";
        return;
      }

      const password = passwordInput.value;

      if (!password) return;

      loginSubmit.disabled = true;
      loginSubmit.textContent = "확인 중";

      try {
        const response = await fetch(
          apiUrl(ENDPOINTS.login),
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({ password })
          }
        );

        if (!response.ok) {
          throw new Error(
            response.status === 401
              ? "비밀번호가 올바르지 않습니다."
              : "관리자 인증에 실패했습니다."
          );
        }

        const data = await response.json();

        if (!data?.token) {
          throw new Error("인증 토큰을 받지 못했습니다.");
        }

        saveToken(data.token);
        passwordInput.value = "";

        showDashboard();
        await loadStats();

      } catch (error) {
        loginError.textContent =
          error?.message ||
          "관리자 인증 중 오류가 발생했습니다.";
      } finally {
        loginSubmit.disabled = false;
        loginSubmit.textContent =
          "관리자 페이지 들어가기";
      }
    });

    /* =========================================================
       06 STATS
       GET /admin/stats?days=7

       expected response:
       {
         "today": {
           "visits": 37,
           "downloads": 8
         },
         "total": {
           "visits": 1284,
           "downloads": 173
         },
         "daily": [
           {
             "date": "2026-08-13",
             "visits": 37,
             "downloads": 8
           }
         ]
       }
       ========================================================= */
    async function loadStats() {
      const token = getToken();

      if (!token) {
        showLogin();
        return;
      }

      refreshBtn.disabled = true;
      setDashboardStatus("통계를 불러오는 중입니다.");

      try {
        const response = await fetch(
          `${apiUrl(ENDPOINTS.stats)}?days=7`,
          {
            method: "GET",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Accept": "application/json"
            },
            cache: "no-store"
          }
        );

        if (response.status === 401) {
          clearToken();
          showLogin();

          loginError.textContent =
            "관리자 인증이 만료되었습니다. 다시 로그인해주세요.";
          return;
        }

        if (!response.ok) {
          throw new Error("통계를 불러오지 못했습니다.");
        }

        const data = await response.json();

        renderStats(data);
        setDashboardStatus(
          `마지막 확인 ${new Date().toLocaleTimeString("ko-KR", {
            hour: "2-digit",
            minute: "2-digit"
          })}`
        );

      } catch (error) {
        setDashboardStatus(
          error?.message ||
          "통계 조회 중 오류가 발생했습니다.",
          true
        );
      } finally {
        refreshBtn.disabled = false;
      }
    }

    function renderStats(data) {
      todayVisits.textContent =
        formatNumber(data?.today?.visits);

      todayDownloads.textContent =
        formatNumber(data?.today?.downloads);

      totalVisits.textContent =
        formatNumber(data?.total?.visits);

      totalDownloads.textContent =
        formatNumber(data?.total?.downloads);

      renderHistory(
        Array.isArray(data?.daily)
          ? data.daily
          : []
      );
    }

    function renderHistory(rows) {
      historyBody.innerHTML = "";

      if (!rows.length) {
        historyEmpty.hidden = false;
        return;
      }

      historyEmpty.hidden = true;

      rows.forEach((row) => {
        const tr = document.createElement("tr");

        const dateTd = document.createElement("td");
        dateTd.textContent = formatDate(row.date);

        const visitsTd = document.createElement("td");
        visitsTd.textContent =
          `${formatNumber(row.visits)}회`;

        const downloadsTd = document.createElement("td");
        downloadsTd.className = "download-count";
        downloadsTd.textContent =
          `${formatNumber(row.downloads)}회`;

        tr.append(
          dateTd,
          visitsTd,
          downloadsTd
        );

        historyBody.appendChild(tr);
      });
    }

    /* =========================================================
       07 REFRESH
       ========================================================= */
    refreshBtn.addEventListener(
      "click",
      loadStats
    );

    /* =========================================================
       08 LOGOUT
       ========================================================= */
    logoutBtn.addEventListener("click", async () => {
      const token = getToken();

      if (token && isApiConfigured()) {
        try {
          await fetch(
            apiUrl(ENDPOINTS.logout),
            {
              method: "POST",
              headers: {
                "Authorization": `Bearer ${token}`
              }
            }
          );
        } catch (_) {
          /* 서버 로그아웃 실패 여부와 관계없이
             브라우저 세션은 종료 */
        }
      }

      clearToken();
      showLogin();
    });

    /* =========================================================
       09 INITIALIZE
       ========================================================= */
    async function initialize() {
      if (!isApiConfigured()) {
        showLogin();

        loginError.textContent =
          "현재는 관리자 화면만 완성된 상태입니다. 카운터 API 연결 후 사용할 수 있습니다.";
        return;
      }

      if (getToken()) {
        showDashboard();
        await loadStats();
      } else {
        showLogin();
      }
    }

    initialize();
  </script>
</body>
</html>
