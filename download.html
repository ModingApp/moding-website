  <!-- =========================================================
       03. 모바일 자동분기 + 유입 추적
       ========================================================= -->
  <script>
    /* =========================================================
       기본 주소
       ========================================================= */

    const TRACK_API =
      "https://flat-queen-f1fb.moding-inc.workers.dev/track/download";

    const ANDROID_URL =
      "https://play.google.com/store/apps/details?id=com.moding.application";

    const IOS_URL =
      "https://apps.apple.com/kr/app/%EB%AA%A8%EB%94%A9-%EC%9A%B0%EB%A6%AC%EC%8B%9D%EB%8B%B9%EC%97%90-%ED%95%84%EC%9A%94%ED%95%9C-%ED%8A%B9%EC%88%98%EC%8B%9D%EC%9E%90%EC%9E%AC/id6772018982";


    /* =========================================================
       User Agent
       ========================================================= */

    const ua =
      navigator.userAgent ||
      navigator.vendor ||
      window.opera ||
      "";


    /* =========================================================
       검색로봇 판별

       검색로봇은 자동 이동하지 않고
       download.html 내용을 정상 수집합니다.
       ========================================================= */

    const isBot =
      /bot|crawl|crawler|spider|slurp|yeti|googlebot|bingbot|daumoa|ads-naver|blueno/i
        .test(ua);


    /* =========================================================
       Android 판별
       ========================================================= */

    const isAndroid =
      /android/i.test(ua);


    /* =========================================================
       iPhone / iPad 판별

       최신 iPadOS는 MacIntel로 표시될 수 있으므로
       maxTouchPoints도 함께 확인합니다.
       ========================================================= */

    const isIOS =
      /iPhone|iPad|iPod/i.test(ua) ||
      (
        navigator.platform === "MacIntel" &&
        navigator.maxTouchPoints > 1
      );


    /* =========================================================
       모바일 자동분기 여부
       ========================================================= */

    const isMobileStoreTarget =
      !isBot &&
      (
        isAndroid ||
        isIOS
      );


    /* =========================================================
       모바일에서는 중간 download.html 화면 숨김

       스토어로 넘어가는 아주 짧은 순간
       PC용 다운로드 카드가 번쩍 보이는 현상을 막습니다.
       ========================================================= */

    if (isMobileStoreTarget) {
      document.documentElement.style.visibility =
        "hidden";
    }


    /* =========================================================
       유입 Source 정리

       사용 예:

       당근
       ?src=daangn

       네이버 카페
       ?src=naver_cafe

       네이버 블로그
       ?src=naver_blog

       유튜브
       ?src=youtube

       전단
       ?src=leaflet
       ========================================================= */

    function normalizeSource(value) {
      const source =
        String(value || "")
          .trim()
          .toLowerCase()
          .replace(
            /[^a-z0-9_-]/g,
            ""
          );

      if (!source) {
        return "";
      }

      return source.slice(
        0,
        50
      );
    }


    /* =========================================================
       src 파라미터가 없는 경우
       document.referrer로 보조 추정
       ========================================================= */

    function detectReferrerSource() {
      const referrer =
        document.referrer || "";

      if (!referrer) {
        return "";
      }

      try {
        const hostname =
          new URL(referrer)
            .hostname
            .toLowerCase();


        if (
          hostname.includes("daangn") ||
          hostname.includes("karrot")
        ) {
          return "daangn";
        }


        if (
          hostname.includes("naver")
        ) {
          return "naver";
        }


        if (
          hostname.includes("kakao") ||
          hostname.includes("daum")
        ) {
          return "kakao";
        }


        if (
          hostname.includes("youtube") ||
          hostname.includes("youtu.be")
        ) {
          return "youtube";
        }


        if (
          hostname.includes("instagram")
        ) {
          return "instagram";
        }


        if (
          hostname.includes("facebook")
        ) {
          return "facebook";
        }


        if (
          hostname.includes("google")
        ) {
          return "google";
        }


        return "referral";

      } catch (error) {
        return "";
      }
    }


    /* =========================================================
       최종 유입 Source 결정

       우선순위:

       1. ?src=
       2. ?utm_source=
       3. 현재 세션에 저장된 source
       4. referrer
       5. direct
       ========================================================= */

    function getTrafficSource() {
      const params =
        new URLSearchParams(
          window.location.search
        );


      const explicitSource =
        normalizeSource(
          params.get("src") ||
          params.get("utm_source")
        );


      if (explicitSource) {
        try {
          sessionStorage.setItem(
            "moding_source",
            explicitSource
          );
        } catch (_) {}

        return explicitSource;
      }


      try {
        const savedSource =
          normalizeSource(
            sessionStorage.getItem(
              "moding_source"
            )
          );

        if (savedSource) {
          return savedSource;
        }

      } catch (_) {}


      const referrerSource =
        detectReferrerSource();


      if (referrerSource) {
        try {
          sessionStorage.setItem(
            "moding_source",
            referrerSource
          );
        } catch (_) {}

        return referrerSource;
      }


      return "direct";
    }


    const trafficSource =
      getTrafficSource();


    /* =========================================================
       다운로드 추적 중복 방지
       ========================================================= */

    let downloadTracked =
      false;


    /* =========================================================
       Worker로 다운로드 분기 정보 전송

       중요한 점:
       keepalive:true

       페이지가 즉시 App Store / Google Play로 이동해도
       브라우저가 요청 전송을 계속 시도합니다.
       ========================================================= */

    function trackDownload(platform) {
      if (downloadTracked) {
        return;
      }


      downloadTracked =
        true;


      const payload = {
        platform:
          platform,

        source:
          trafficSource,

        path:
          window.location.pathname,

        referrer:
          document.referrer || ""
      };


      try {
        fetch(
          TRACK_API,
          {
            method:
              "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body:
              JSON.stringify(
                payload
              ),

            keepalive:
              true
          }
        ).catch(
          () => {}
        );

      } catch (_) {}
    }


    /* =========================================================
       스토어 즉시 이동

       이전처럼 250ms 기다리지 않습니다.

       추적 요청만 발생시키고
       즉시 스토어로 이동합니다.
       ========================================================= */

    function trackAndRedirect(
      platform,
      storeUrl
    ) {
      trackDownload(
        platform
      );


      window.location.replace(
        storeUrl
      );
    }


    /* =========================================================
       모바일 자동분기

       Android
       → Google Play

       iPhone / iPad
       → App Store

       PC / Mac
       → 자동 이동 없음
       → 아래 다운로드 페이지 표시
       ========================================================= */

    if (isMobileStoreTarget) {
      if (isAndroid) {
        trackAndRedirect(
          "android",
          ANDROID_URL
        );

      } else if (isIOS) {
        trackAndRedirect(
          "ios",
          IOS_URL
        );
      }


      /*
       * 특수 인앱 브라우저 등에서
       * 외부 스토어 이동이 실패하는 경우를 대비합니다.
       *
       * 1.8초 뒤에도 download.html에 남아 있다면
       * PC용 선택 화면을 다시 보여줍니다.
       */

      setTimeout(
        () => {
          document.documentElement.style.visibility =
            "visible";
        },
        1800
      );
    }
  </script>

  <!-- =========================================================
       10. PC / 자동분기 실패 시 수동 버튼 추적
       ========================================================= -->

  <script>
    const iosDownloadButton =
      document.getElementById(
        "iosDownloadButton"
      );


    const androidDownloadButton =
      document.getElementById(
        "androidDownloadButton"
      );


    if (iosDownloadButton) {
      iosDownloadButton.addEventListener(
        "click",
        () => {
          trackDownload(
            "ios"
          );
        }
      );
    }


    if (androidDownloadButton) {
      androidDownloadButton.addEventListener(
        "click",
        () => {
          trackDownload(
            "android"
          );
        }
      );
    }
  </script>
